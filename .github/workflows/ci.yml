name: CI
on:
  push:
    branches: [poc, dev, qa, prod, main]
  pull_request:
    branches: [dev, qa, prod, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test
